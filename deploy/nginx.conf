# Nginx 站点配置 —— Django + React 博客
# 部署位置：拷贝到 /etc/nginx/sites-available/blog，然后软链到 sites-enabled/
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/blog
#   sudo ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/blog
#   sudo nginx -t && sudo systemctl reload nginx
# SSL：本文件只写 80 端口段，443 段由 certbot --nginx 自动生成
#   sudo certbot --nginx -d www.xuzixuan.top
# certbot 会自动改写 80 段为 301 重定向到 443，并追加 443 ssl 段
#
# gzip 配置在 /etc/nginx/nginx.conf 的 http 块里统一管理，站点配置里不重复

server {
    # 同时监听 IPv4 和 IPv6 的 80 端口
    listen 80;
    listen [::]:80;

    server_name www.xuzixuan.top 10.83.36.241 100.93.171.11 localhost;

    # certbot 会自动在此插入 80→443 重定向（运行 certbot --nginx 后）
    # 在 certbot 接管前，80 端口直接服务站点，用于局域网 HTTP 访问验证

    # 客户端上传大文件支持（与 markdownx 上传限制一致）
    client_max_body_size 150M;

    # Django 静态文件（collectstatic 收拢目录）
    location /static/ {
        alias /home/pi/blog/server/django/static_collected/;
    }

    # Django 媒体文件（用户上传）
    location /media/ {
        alias /home/pi/blog/server/django/media/;
    }

    # 前端 SPA（React + Vite 构建产物）
    location / {
        root /home/pi/blog/dist;
        try_files $uri $uri/ /index.html;
    }

    # 反代到 Gunicorn：API 接口
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反代到 Gunicorn：Django 后台
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反代到 Gunicorn：markdownx 上传接口
    location /markdownx/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
